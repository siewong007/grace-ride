# Production stack: Caddy (automatic HTTPS) → Grace Ride (API + web) → SQLite on a volume.
# Usage:  cp deploy/.env.production.example .env.production   (then edit it)
#         docker compose --env-file .env.production up -d --build
# Continuous DB backup to S3-compatible storage: add --profile backup
services:
  app:
    build: .
    image: grace-ride:latest
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - app-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]
    deploy:
      resources:
        limits: { memory: 512m }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  litestream:
    profiles: ["backup"]
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env.production
    volumes:
      - app-data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro

volumes:
  app-data:
  caddy-data:
  caddy-config:
