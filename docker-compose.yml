# Production stack: Caddy (automatic HTTPS) → Grace Ride (API + web) → PostgreSQL on a volume.
# Usage:  cp deploy/.env.production.example .env.production   (then edit it)
#         docker compose --env-file .env.production up -d --build
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - jit=off
      - -c
      - log_min_duration_statement=250
    environment:
      POSTGRES_USER: grace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: grace_ride
    volumes:
      - pg-data:/var/lib/postgresql
    shm_size: 128m
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 60s
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grace -d grace_ride"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database

  app:
    build: .
    image: grace-ride:latest
    restart: unless-stopped
    init: true
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://grace:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@db/grace_ride
      TRUST_PROXY: "true"
      RUST_LOG: ${RUST_LOG:-grace_ride=info,tower_http=warn}
    env_file: .env.production
    volumes:
      - app-data:/data
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]
    mem_limit: 512m
    pids_limit: 512
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks:
      - frontend
      - database

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ["/tmp:noexec,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    networks:
      - frontend

networks:
  frontend:
  database:
    internal: true

volumes:
  pg-data:
  app-data:
  caddy-data:
  caddy-config:
