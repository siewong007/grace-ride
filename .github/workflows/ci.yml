name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgres://grace:grace@localhost:5432/grace_ride_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: grace
          POSTGRES_PASSWORD: grace
          POSTGRES_DB: grace_ride_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Free runner disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Dependency advisories
        # Advisory ignores are maintained in backend/.cargo/audit.toml (single source of truth).
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend:
    runs-on: ubuntu-latest
    # Visual baselines (e2e/*-linux.png) were rendered in this image; a plain runner has
    # different fonts and fails every screenshot. Keep the tag equal to the
    # @playwright/test version in package-lock.json, and retake the baselines when it moves.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Verify Playwright container tag matches package-lock.json
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const ver = lock.packages?.["node_modules/@playwright/test"]?.version;
            if (ver !== "1.65.0") {
              console.error(`@playwright/test in package-lock.json is ${ver}, expected 1.65.0 to match container image`);
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      # Audit shipped production bundle dependencies (dev-only picomatch<=4.0.7 GHSA-fc5q-39xc-vjpf has no upstream patch yet).
      - run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Free runner disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: grace-ride:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
