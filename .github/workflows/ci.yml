name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgres://grace:grace@localhost:5432/grace_ride_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: grace
          POSTGRES_PASSWORD: grace
          POSTGRES_DB: grace_ride_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Free runner disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h
      - uses: actions/checkout@11d5960a326750d5838078e86cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: backend }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Dependency advisories
        # Advisory ignores are maintained in backend/.cargo/audit.toml (single source of truth).
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend:
    runs-on: ubuntu-latest
    # Visual baselines (e2e/*-linux.png) were rendered in this image; a plain runner has
    # different fonts and fails every screenshot. Keep the tag equal to the
    # @playwright/test version in package-lock.json, and retake the baselines when it moves.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e86cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Verify Playwright container tag matches package-lock.json
        run: |
          node -e '
            const lock = require("./package-lock.json");
            const ver = lock.packages?.["node_modules/@playwright/test"]?.version;
            if (ver !== "1.65.0") {
              console.error(`@playwright/test in package-lock.json is ${ver}, expected 1.65.0 to match container image`);
              process.exit(1);
            }
          '
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      # Audit shipped production bundle dependencies (dev-only picomatch<=4.0.7 GHSA-fc5q-39xc-vjpf has no upstream patch yet).
      - run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e86cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:compileDebugAndroidTestKotlin --no-daemon

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e86cf38b85af677262 # v4
        with: { persist-credentials: false }
      - name: Run GraceRideKit unit tests
        run: swift test --package-path ios/GraceRideKit
      - name: Build GraceRide iOS app & WidgetKit extension
        run: xcodebuild -project ios/GraceRide.xcodeproj -scheme GraceRide -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Free runner disk space
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h
      - uses: actions/checkout@11d5960a326750d5838078e86cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: grace-ride:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
