name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      TEST_DATABASE_URL: postgres://grace:grace@localhost:5432/grace_ride_test
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: grace
          POSTGRES_PASSWORD: grace
          POSTGRES_DB: grace_ride_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Dependency advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459

  frontend:
    runs-on: ubuntu-latest
    # Visual baselines (e2e/*-linux.png) were rendered in this image; a plain runner has
    # different fonts and fails every screenshot. Keep the tag equal to the
    # @playwright/test version in package-lock.json, and retake the baselines when it moves.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - name: Upload Playwright failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-output
          path: frontend/test-results/**/*.png
          retention-days: 1

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: grace-ride:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
