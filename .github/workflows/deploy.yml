name: Deploy production

# A push to master whose CI run passes builds the image on a GitHub runner and
# rolls it onto the AIC VPS.
#
# Required GitHub Environment (`production`) secret:
#   - VPS_SSH_PRIVATE_KEY  (private SSH key for the VPS deploy user)
# Required GitHub Environment (`production`) variables (`vars.*`):
#   - VPS_HOST             (VPS hostname or IP)
#   - VPS_PORT             (SSH port)
#   - VPS_USER             (SSH deploy user)
#   - VPS_HOST_KEY         (SSH known_hosts entry for the pinned host key)
# Optional GitHub Environment (`production`) variable:
#   - VPS_HOST_FP          (expected SSH SHA256 fingerprint verified via ssh-keygen -lf)
#
# The database container and its volume stay in place across upgrades; on a brand-new VPS
# where `grace-ride-db` is not running yet, it is started and awaited first.
# `deploy/docker-compose.aic.yml` and `deploy/docker-compose.osrm.yml` are synced to
# `/opt/grace-ride/` on every roll.
# Manual dispatch: Actions → Deploy production → Run workflow.

# Deploys only after CI has passed for the pushed commit. A push that fails lint,
# tests, e2e or the dependency audit never reaches production.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: grace-ride-production
  cancel-in-progress: false

env:
  VPS_HOST: ${{ vars.VPS_HOST }}
  VPS_PORT: ${{ vars.VPS_PORT }}
  VPS_USER: ${{ vars.VPS_USER }}
  VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
  VPS_HOST_FP: ${{ vars.VPS_HOST_FP }}
  PUBLIC_URL: https://graceride.saliminn.my

jobs:
  build:
    name: Build release image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    # Build master push with passed CI, or manual dispatch restricted to master.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Check out the commit CI tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

      - name: Resolve commit SHA
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: grace-ride:${{ env.SHA }}
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export compressed image tarball and deploy manifests
        shell: bash
        run: |
          set -euo pipefail
          sha="$SHA"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "grace-ride:$sha")" = "linux/amd64"
          mkdir -p "$RUNNER_TEMP/deploy-bundle"
          docker save "grace-ride:$sha" | gzip -1 > "$RUNNER_TEMP/deploy-bundle/grace-ride-$sha.tar.gz"
          gzip -t "$RUNNER_TEMP/deploy-bundle/grace-ride-$sha.tar.gz"
          cp deploy/docker-compose.aic.yml "$RUNNER_TEMP/deploy-bundle/docker-compose.aic.yml"
          if [[ -f deploy/docker-compose.osrm.yml ]]; then
            cp deploy/docker-compose.osrm.yml "$RUNNER_TEMP/deploy-bundle/docker-compose.osrm.yml"
          fi
          (
            cd "$RUNNER_TEMP/deploy-bundle"
            files=("grace-ride-$sha.tar.gz" "docker-compose.aic.yml")
            [[ -f docker-compose.osrm.yml ]] && files+=("docker-compose.osrm.yml")
            sha256sum "${files[@]}" > SHA256SUMS
          )

      - name: Upload deploy bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grace-ride-deploy-${{ env.SHA }}
          path: ${{ runner.temp }}/deploy-bundle
          retention-days: 1

  deploy:
    name: Roll onto AIC
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grace-ride-deploy-${{ needs.build.outputs.sha }}
          path: ${{ runner.temp }}/deploy-bundle

      - name: Stage tarball for deploy
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          (cd "$RUNNER_TEMP/deploy-bundle" && sha256sum -c SHA256SUMS)
          gzip -t "$RUNNER_TEMP/deploy-bundle/grace-ride-$SHA.tar.gz"
          mv "$RUNNER_TEMP/deploy-bundle/grace-ride-$SHA.tar.gz" "$RUNNER_TEMP/grace-ride-$SHA.tar.gz"

      - name: Configure pinned SSH access
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_SSH_PRIVATE_KEY:-}" || { echo "VPS_SSH_PRIVATE_KEY secret is required" >&2; exit 1; }
          test -n "${VPS_HOST_KEY:-}" || { echo "VPS_HOST_KEY var is required" >&2; exit 1; }
          test -n "${VPS_HOST:-}" || { echo "VPS_HOST var is required" >&2; exit 1; }
          test -n "${VPS_PORT:-}" || { echo "VPS_PORT var is required" >&2; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo "VPS_PORT must be numeric" >&2; exit 1; }
          test -n "${VPS_USER:-}" || { echo "VPS_USER var is required" >&2; exit 1; }
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-known-hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/vps-known-hosts"
          if [[ -n "${VPS_HOST_FP:-}" ]]; then
            ssh-keygen -lf "$RUNNER_TEMP/vps-known-hosts" | grep -Fq "$VPS_HOST_FP"
          else
            ssh-keygen -lf "$RUNNER_TEMP/vps-known-hosts" >/dev/null
          fi

      - name: Upload the image and roll the app
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_opts=(
            -i "$RUNNER_TEMP/vps-key"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts"
          )
          prev_image=$(ssh "${ssh_opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker inspect -f '{{.Config.Image}}' grace-ride 2>/dev/null || true")
          prev_tag="${prev_image#grace-ride:}"
          if [[ -z "$prev_image" || ! "$prev_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            prev_tag="none"
          fi
          echo "OLD_TAG=$prev_tag" >> "$GITHUB_ENV"

          remote_stage=$(ssh "${ssh_opts[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "install -d -m 0700 /opt/grace-ride && mktemp -d /opt/grace-ride/.deploy.XXXXXX")
          [[ "$remote_stage" =~ ^/opt/grace-ride/\.deploy\.[A-Za-z0-9]+$ ]] \
            || { echo "Unexpected remote stage path: $remote_stage" >&2; exit 1; }
          echo "REMOTE_STAGE=$remote_stage" >> "$GITHUB_ENV"

          scp "${ssh_opts[@]}" -P "$VPS_PORT" \
            "$RUNNER_TEMP/deploy-bundle/docker-compose.aic.yml" \
            "$VPS_USER@$VPS_HOST:$remote_stage/docker-compose.aic.$SHA.yml"
          if [[ -f "$RUNNER_TEMP/deploy-bundle/docker-compose.osrm.yml" ]]; then
            scp "${ssh_opts[@]}" -P "$VPS_PORT" \
              "$RUNNER_TEMP/deploy-bundle/docker-compose.osrm.yml" \
              "$VPS_USER@$VPS_HOST:$remote_stage/docker-compose.osrm.$SHA.yml"
          fi
          scp "${ssh_opts[@]}" -P "$VPS_PORT" \
            "$RUNNER_TEMP/grace-ride-$SHA.tar.gz" \
            "$VPS_USER@$VPS_HOST:$remote_stage/grace-ride-$SHA.tar.gz.part"

          ssh "${ssh_opts[@]}" -p "$VPS_PORT" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            "$VPS_USER@$VPS_HOST" \
            "SHA='$SHA' REMOTE_STAGE='$remote_stage' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REMOTE_STAGE" =~ ^/opt/grace-ride/\.deploy\.[A-Za-z0-9]+$ ]]
          avail=$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')
          if [[ "$avail" -lt 1500000000 ]]; then
            echo "Not enough free disk for a Grace Ride roll" >&2
            df -h / >&2
            exit 1
          fi

          if [[ -f /opt/grace-ride/docker-compose.aic.yml ]]; then
            cp -a /opt/grace-ride/docker-compose.aic.yml /opt/grace-ride/docker-compose.aic.yml.prev
          fi
          install -m 0644 "$REMOTE_STAGE/docker-compose.aic.$SHA.yml" /opt/grace-ride/docker-compose.aic.yml
          rm -f "$REMOTE_STAGE/docker-compose.aic.$SHA.yml"
          if [[ -f "$REMOTE_STAGE/docker-compose.osrm.$SHA.yml" ]]; then
            if [[ -f /opt/grace-ride/docker-compose.osrm.yml ]]; then
              cp -a /opt/grace-ride/docker-compose.osrm.yml /opt/grace-ride/docker-compose.osrm.yml.prev
            fi
            install -m 0644 "$REMOTE_STAGE/docker-compose.osrm.$SHA.yml" /opt/grace-ride/docker-compose.osrm.yml
            rm -f "$REMOTE_STAGE/docker-compose.osrm.$SHA.yml"
          fi

          old_image=$(docker inspect -f '{{.Config.Image}}' grace-ride 2>/dev/null || echo '')
          if [[ -z "$old_image" ]]; then
            echo "No existing app container; will start fresh."
            old_image="grace-ride:none"
          fi
          old_tag=${old_image#grace-ride:}
          if [[ ! "$old_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            old_tag="none"
          fi

          set_image_tag() {
            local tag="$1"
            [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid image tag: $tag" >&2; exit 1; }
            if grep -q '^IMAGE_TAG=' /opt/grace-ride/secrets.env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${tag}/" /opt/grace-ride/secrets.env
            else
              [[ -s /opt/grace-ride/secrets.env && -n "$(tail -c 1 /opt/grace-ride/secrets.env)" ]] \
                && printf '\n' >> /opt/grace-ride/secrets.env
              printf 'IMAGE_TAG=%s\n' "$tag" >> /opt/grace-ride/secrets.env
            fi
          }

          mkdir -p /opt/grace-ride/pre-roll-backups
          chmod 700 /opt/grace-ride/pre-roll-backups

          ensure_secrets_encryption_key() {
            chmod 600 /opt/grace-ride/secrets.env 2>/dev/null || true
            if ! grep -qE '^SECRETS_ENCRYPTION_KEY=[^[:space:]]+' /opt/grace-ride/secrets.env; then
              local new_key
              new_key="$(openssl rand -hex 32)"
              [[ -s /opt/grace-ride/secrets.env && -n "$(tail -c 1 /opt/grace-ride/secrets.env)" ]] \
                && printf '\n' >> /opt/grace-ride/secrets.env
              printf 'SECRETS_ENCRYPTION_KEY=%s\n' "$new_key" >> /opt/grace-ride/secrets.env
              echo "Initialized SECRETS_ENCRYPTION_KEY in /opt/grace-ride/secrets.env"
            fi
          }

          write_pre_roll_dump() {
            local dump_base="/opt/grace-ride/pre-roll-backups/pre-${SHA}.dump"
            local age_pub enc_key allow_plain
            age_pub=$(grep -E '^BACKUP_AGE_RECIPIENT=' /opt/grace-ride/secrets.env 2>/dev/null | head -n 1 | cut -d= -f2- | tr -d "\"'\r\n" || true)
            enc_key=$(grep -E '^SECRETS_ENCRYPTION_KEY=' /opt/grace-ride/secrets.env 2>/dev/null | head -n 1 | cut -d= -f2- | tr -d "\"'\r\n" || true)
            allow_plain=$(grep -E '^ALLOW_PLAINTEXT_PRE_ROLL_DUMP=' /opt/grace-ride/secrets.env 2>/dev/null | head -n 1 | cut -d= -f2- | tr -d "\"'\r\n" || true)
            (
              umask 077
              if [[ -n "$age_pub" ]] && command -v age >/dev/null 2>&1; then
                docker exec grace-ride-db pg_dump -U grace -d grace_ride -Fc | age -r "$age_pub" -o "${dump_base}.age"
                chmod 600 "${dump_base}.age"
              elif [[ -n "$enc_key" ]] && command -v openssl >/dev/null 2>&1; then
                # Fallback symmetric encryption at rest using SECRETS_ENCRYPTION_KEY via env.
                # Recover with: PRE_ROLL_ENC_KEY="$SECRETS_ENCRYPTION_KEY" openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PRE_ROLL_ENC_KEY -in <file>.enc -out pre.dump
                docker exec grace-ride-db pg_dump -U grace -d grace_ride -Fc \
                  | PRE_ROLL_ENC_KEY="$enc_key" openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PRE_ROLL_ENC_KEY -out "${dump_base}.enc"
                chmod 600 "${dump_base}.enc"
              elif [[ "$allow_plain" == "true" ]]; then
                docker exec grace-ride-db pg_dump -U grace -d grace_ride -Fc > "$dump_base"
                chmod 600 "$dump_base"
              else
                echo "Refusing unencrypted pre-roll DB dump (set BACKUP_AGE_RECIPIENT + install age, configure SECRETS_ENCRYPTION_KEY + openssl, or set ALLOW_PLAINTEXT_PRE_ROLL_DUMP=true)" >&2
                exit 1
              fi
            )
            ls -1t /opt/grace-ride/pre-roll-backups/pre-*.dump* 2>/dev/null | tail -n +3 | xargs -r rm -f
          }

          ensure_secrets_encryption_key

          initial_users=0
          pre_dump_done=0
          if [[ "$(docker inspect -f '{{.State.Running}}' grace-ride-db 2>/dev/null || echo false)" == "true" ]]; then
            initial_users=$(docker exec grace-ride-db psql -U grace -d grace_ride -tAc 'SELECT COUNT(*) FROM users' 2>/dev/null || echo 0)
            initial_users=${initial_users//[$'\t\r\n ']/}
            initial_users=${initial_users:-0}
            if [[ "$initial_users" =~ ^[0-9]+$ ]] && (( initial_users > 0 )); then
              write_pre_roll_dump
              pre_dump_done=1
            fi
          fi

          mv "$REMOTE_STAGE/grace-ride-$SHA.tar.gz.part" "$REMOTE_STAGE/grace-ride-$SHA.tar.gz"
          gzip -t "$REMOTE_STAGE/grace-ride-$SHA.tar.gz"
          gunzip -c "$REMOTE_STAGE/grace-ride-$SHA.tar.gz" | docker load
          rm -rf "$REMOTE_STAGE"

          net_internal=$(docker network inspect -f '{{.Internal}}' grace-ride_database 2>/dev/null || echo missing)
          if [[ "$net_internal" == "false" ]] && grep -qE '^[[:space:]]+internal:[[:space:]]+true' /opt/grace-ride/docker-compose.aic.yml; then
            echo "Migrating grace-ride_database network to internal: true (preserving volumes)..."
            IMAGE_TAG="${SHA}" docker compose \
              --env-file /opt/grace-ride/secrets.env \
              -f /opt/grace-ride/docker-compose.aic.yml \
              down
          fi

          # Ensure grace-ride-db is running and healthy (handles first boot on a fresh VPS).
          if [[ "$(docker inspect -f '{{.State.Running}}' grace-ride-db 2>/dev/null || echo false)" != "true" ]]; then
            echo "grace-ride-db is not running; booting database container first..."
            IMAGE_TAG="${SHA}" docker compose \
              --env-file /opt/grace-ride/secrets.env \
              -f /opt/grace-ride/docker-compose.aic.yml \
              up -d db
          fi
          db_healthy=0
          for i in $(seq 1 30); do
            if [[ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' grace-ride-db 2>/dev/null || echo none)" == "healthy" ]]; then
              db_healthy=1
              break
            fi
            sleep 2
          done
          if [[ "$db_healthy" != 1 ]]; then
            echo "grace-ride-db failed to reach healthy state" >&2
            docker logs grace-ride-db --tail 30 >&2 || true
            exit 1
          fi

          # Empty/fresh DBs may not have a users table yet (pre-migrate).
          users_before=$(docker exec grace-ride-db psql -U grace -d grace_ride -tAc 'SELECT COUNT(*) FROM users' 2>/dev/null || echo 0)
          users_before=${users_before//[$'\t\r\n ']/}
          users_before=${users_before:-0}
          if [[ "$initial_users" =~ ^[0-9]+$ ]] && (( initial_users > 0 )); then
            users_before="$initial_users"
          fi
          db_before=$(docker inspect -f '{{.Id}}' grace-ride-db)
          echo "users_before=$users_before"
          echo "old_image=$old_image"

          rollback() {
            trap - ERR
            if [[ "$old_tag" == "none" || -z "$old_tag" ]]; then
              echo "No previous image to restore" >&2
              return 0
            fi
            if [[ -f /opt/grace-ride/docker-compose.aic.yml.prev ]]; then
              mv -f /opt/grace-ride/docker-compose.aic.yml.prev /opt/grace-ride/docker-compose.aic.yml
            fi
            if [[ -f /opt/grace-ride/docker-compose.osrm.yml.prev ]]; then
              mv -f /opt/grace-ride/docker-compose.osrm.yml.prev /opt/grace-ride/docker-compose.osrm.yml
            fi
            set_image_tag "$old_tag"
            if ! docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml up -d --no-deps --force-recreate app; then
              IMAGE_TAG="$old_tag" docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml down
              IMAGE_TAG="$old_tag" docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml up -d
            fi
          }
          trap rollback ERR

          if [[ "$pre_dump_done" == "0" ]] && (( users_before > 0 )); then
            write_pre_roll_dump
          fi

          set_image_tag "$SHA"
          grep -q "^IMAGE_TAG=${SHA}$" /opt/grace-ride/secrets.env
          docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml up -d --no-deps --force-recreate app

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/api/health; then
              echo
              echo "health_try=$i"
              ok=1
              break
            fi
            sleep 2
          done
          db_after=$(docker inspect -f '{{.Id}}' grace-ride-db)
          users_after=$(docker exec grace-ride-db psql -U grace -d grace_ride -tAc 'SELECT COUNT(*) FROM users' 2>/dev/null || echo 0)
          users_after=${users_after//[$'\t\r\n ']/}
          users_after=${users_after:-0}
          echo "users_after=$users_after"

          # Allow first-boot seed growth (0→1 admin) or unchanged counts.
          # Reject unexpected shrinkage; keep health + same DB container checks.
          if [[ "$ok" != 1 || "$db_before" != "$db_after" ]]; then
            echo "roll failed (health/db); restoring $old_image" >&2
            # Capture the failed container's logs BEFORE rollback replaces it.
            docker logs grace-ride 2>&1 | grep -v -e 'one-time' -e '/invite/' | tail -60 >&2 || true
            rollback
            exit 1
          fi
          if ! [[ "$users_after" =~ ^[0-9]+$ && "$users_before" =~ ^[0-9]+$ ]]; then
            echo "roll failed (user count unreadable); restoring $old_image" >&2
            rollback
            exit 1
          fi
          if (( users_after < users_before )); then
            echo "roll failed (users shrank $users_before → $users_after); restoring $old_image" >&2
            docker logs grace-ride 2>&1 | grep -v -e 'one-time' -e '/invite/' | tail -60 >&2 || true
            rollback
            exit 1
          fi
          if (( users_before == 0 && users_after > 0 )); then
            echo "first_boot_seed users_before=0 users_after=$users_after"
          elif (( users_after != users_before )); then
            echo "user_count_grew $users_before → $users_after (allowed)"
          fi
          docker images grace-ride --format '{{.Repository}}:{{.Tag}}' | while read -r img; do
            if [[ "$img" != "grace-ride:$SHA" && "$img" != "$old_image" ]]; then
              docker image rm "$img" >/dev/null 2>&1 || true
            fi
          done
          echo "app_image=$(docker inspect -f '{{.Config.Image}}' grace-ride)"
          REMOTE

      - name: Check the public site
        id: public_check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            "$PUBLIC_URL/api/health"
          echo
          echo "Public health check passed."

      - name: Roll back app if public check failed
        if: failure() && steps.public_check.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OLD_TAG:-}" || "$OLD_TAG" == "none" ]]; then
            echo "Public health check failed, and no previous image existed on VPS to restore." >&2
            exit 0
          fi
          [[ "$OLD_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          echo "Public health check failed; restoring grace-ride:$OLD_TAG on VPS..." >&2
          ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "OLD_TAG='$OLD_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$OLD_TAG" =~ ^[A-Za-z0-9._-]+$ ]]
          if [[ -f /opt/grace-ride/docker-compose.aic.yml.prev ]]; then
            mv -f /opt/grace-ride/docker-compose.aic.yml.prev /opt/grace-ride/docker-compose.aic.yml
          fi
          if [[ -f /opt/grace-ride/docker-compose.osrm.yml.prev ]]; then
            mv -f /opt/grace-ride/docker-compose.osrm.yml.prev /opt/grace-ride/docker-compose.osrm.yml
          fi
          if grep -q '^IMAGE_TAG=' /opt/grace-ride/secrets.env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${OLD_TAG}/" /opt/grace-ride/secrets.env
          else
            printf 'IMAGE_TAG=%s\n' "$OLD_TAG" >> /opt/grace-ride/secrets.env
          fi
          if ! docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml up -d --no-deps --force-recreate app; then
            IMAGE_TAG="$OLD_TAG" docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml down
            IMAGE_TAG="$OLD_TAG" docker compose --env-file /opt/grace-ride/secrets.env -f /opt/grace-ride/docker-compose.aic.yml up -d
          fi
          echo "Rolled back app_image=$(docker inspect -f '{{.Config.Image}}' grace-ride)"
          REMOTE

      - name: Remove temporary deploy artifacts
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/vps-key" && -s "$RUNNER_TEMP/vps-known-hosts" && -n "${SHA:-}" ]]; then
            clean_prev=""
            if [[ "${{ steps.public_check.outcome }}" == "success" ]]; then
              clean_prev="/opt/grace-ride/docker-compose.aic.yml.prev /opt/grace-ride/docker-compose.osrm.yml.prev"
            fi
            clean_stage=""
            if [[ -n "${REMOTE_STAGE:-}" && "$REMOTE_STAGE" =~ ^/opt/grace-ride/\.deploy\.[A-Za-z0-9]+$ ]]; then
              clean_stage="$REMOTE_STAGE"
            fi
            ssh \
              -i "$RUNNER_TEMP/vps-key" \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
              "$VPS_USER@$VPS_HOST" \
              "rm -rf -- ${clean_stage} && rm -f -- $clean_prev" \
              || true
          fi
          rm -f "$RUNNER_TEMP/vps-key" "$RUNNER_TEMP/vps-known-hosts" "$RUNNER_TEMP/grace-ride-$SHA.tar.gz"
          rm -rf "$RUNNER_TEMP/deploy-bundle"
