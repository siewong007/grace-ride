# Continuous SQLite replication (point-in-time restore). Uploaded receipts are backed up
# separately by scripts/backup.sh — litestream only covers the database.
dbs:
  - path: /data/grace_ride.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: grace-ride
        endpoint: ${LITESTREAM_ENDPOINT}
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        retention: 720h
        sync-interval: 10s
