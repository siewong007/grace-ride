# Grace Ride on the AIC cloud VPS (vps-av1w).
#
# Host Caddy owns ports 80/443. This stack binds only 127.0.0.1:8090.
# Postgres is not published. Maintenance: docker exec grace-ride-db.
#
# /opt/grace-ride/secrets.env supplies POSTGRES_PASSWORD, ADMIN_EMAIL, IMAGE_TAG,
# and optional runtime tunables (OSRM_URL, ROUTING_ENABLED, SESSION_TIMEOUT_MINS,
# PUSH_ALLOWED_HOSTS, DB_MAX_CONNECTIONS, NOTIFICATION_RETENTION_DAYS,
# TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, etc.).
# The image is loaded on the host; this file does not build it.

name: grace-ride

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    container_name: grace-ride-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_parallel_workers=1
    environment:
      POSTGRES_USER: grace
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: grace_ride
    volumes:
      - pg-data:/var/lib/postgresql
    shm_size: 64mb
    mem_limit: 160m
    cpus: 0.25
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grace -d grace_ride"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    networks:
      - database

  app:
    image: "grace-ride:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: grace-ride
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    env_file:
      - path: /opt/grace-ride/secrets.env
        required: false
    # Explicit keys in `environment` take precedence over `env_file` in Docker Compose,
    # keeping production security invariants (DEV_MODE=false, TRUST_PROXY=true) locked
    # while allowing operator tunables in /opt/grace-ride/secrets.env to apply.
    environment:
      DATABASE_URL: "postgres://grace:${POSTGRES_PASSWORD}@db/grace_ride"
      PUBLIC_URL: "${PUBLIC_URL:-https://graceride.saliminn.my}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:?ADMIN_EMAIL is required}"
      DEV_MODE: "false"
      TRUST_PROXY: "true"
      LOG_FORMAT: json
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?SECRETS_ENCRYPTION_KEY must be set (64 hex chars / 32-byte key)}
      BIND: "0.0.0.0:8080"
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /app/web
      TZ: Asia/Kuala_Lumpur
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Kuala_Lumpur}"
      MAX_LIVE_DRIVERS: "${MAX_LIVE_DRIVERS:-10}"
      SESSION_TIMEOUT_MINS: "${SESSION_TIMEOUT_MINS:-15}"
      DB_MAX_CONNECTIONS: "${DB_MAX_CONNECTIONS:-10}"
      NOTIFICATION_RETENTION_DAYS: "${NOTIFICATION_RETENTION_DAYS:-90}"
      ROUTING_ENABLED: "${ROUTING_ENABLED:-true}"
      OSRM_URL: "${OSRM_URL:-https://router.project-osrm.org}"
      NOMINATIM_URL: "${NOMINATIM_URL:-https://nominatim.openstreetmap.org}"
      PHOTON_URL: "${PHOTON_URL:-https://photon.komoot.io}"
      GEOCODER_USER_AGENT: "${GEOCODER_USER_AGENT:-GraceRide/0.1 (+https://graceride.saliminn.my)}"
      CHAT_RETENTION_DAYS: "${CHAT_RETENTION_DAYS:-180}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-730}"
      RUST_LOG: "${RUST_LOG:-grace_ride=info,tower_http=warn}"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.40
    pids_limit: 512
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - database
      - egress

networks:
  database:
    internal: true
  egress: {}

volumes:
  pg-data:
  app-data:
