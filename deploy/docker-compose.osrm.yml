# Companion Compose overlay: self-hosted OSRM (Malaysia/Singapore/Brunei MLD graph).
#
# Prepare graph data once (and refresh monthly/quarterly):
#   sudo ./scripts/setup_osrm_malaysia.sh /opt/grace-ride/osrm-data
#
# Enable in /opt/grace-ride/secrets.env:
#   ROUTING_ENABLED=true
#   OSRM_URL=http://grace-ride-osrm:5000
#
# Start alongside the AIC stack:
#   docker compose --env-file /opt/grace-ride/secrets.env \
#     -f /opt/grace-ride/docker-compose.aic.yml \
#     -f /opt/grace-ride/docker-compose.osrm.yml up -d

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: grace-ride-osrm
    restart: unless-stopped
    init: true
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "100"
      - /data/malaysia-singapore-brunei-latest.osrm
    volumes:
      - "${OSRM_DATA_DIR:-/opt/grace-ride/osrm-data}:/data:ro"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 128
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- 'http://127.0.0.1:5000/nearest/v1/driving/101.642,3.103?number=1' | grep -q '\"Ok\"'"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - database
