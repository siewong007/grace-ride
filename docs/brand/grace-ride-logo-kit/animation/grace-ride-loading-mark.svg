<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 240 240" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Grace Ride – animated loading mark</title>
  <!-- Plays once (cross lands, ground ripples, arc sweeps in), then the ripples keep pulsing while loading. -->
  <style>
    .drop{animation:drop 1s .15s cubic-bezier(.25,.1,.15,1) both}
    .ground{transform-box:view-box;transform-origin:120px 213px;animation:ground .5s 1.1s cubic-bezier(.2,.8,.2,1) both}
    .ping{transform-box:view-box;transform-origin:120px 213px;animation:ping 2.4s 1.12s infinite both}
    .ping2{animation-delay:1.42s}
    .arc-l{stroke-dasharray:94 94;animation:arc .37s 1.2s linear both}
    .arc-r{stroke-dasharray:94 94;animation:arc .37s 1.68s linear both}
    .dot-l{transform-box:view-box;transform-origin:41.76px 150.04px;animation:pop .2s 1.2s ease-out both}
    .dot-r{transform-box:view-box;transform-origin:198.24px 150.04px;animation:pop .2s 2s ease-out both}
    @keyframes drop{0%{transform:translateY(-70px);opacity:0}35%{opacity:1}100%{transform:none;opacity:1}}
    @keyframes ground{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
    @keyframes ping{0%{transform:scale(.5);opacity:0}6%{opacity:.7}55%,100%{transform:scale(2.8);opacity:0}}
    @keyframes arc{from{stroke-dashoffset:94}to{stroke-dashoffset:0}}
    @keyframes pop{from{transform:scale(0)}to{transform:none}}
    @media (prefers-reduced-motion: reduce){
      .drop,.ground,.ping,.arc-l,.arc-r,.dot-l,.dot-r{animation:none}
      .arc-l,.arc-r{stroke-dasharray:none}
      .ping{opacity:0}
    }
  </style>
  <path class="arc-l" d="M41.76 150.04 A81 81 0 0 1 107 91.05" fill="none" stroke="#1F5DB4" stroke-width="5"/>
  <path class="arc-r" d="M133 91.05 A81 81 0 0 1 198.24 150.04" fill="none" stroke="#1F5DB4" stroke-width="5"/>
  <circle class="dot-l" cx="41.76" cy="150.04" r="2.5" fill="#1F5DB4"/>
  <circle class="dot-r" cx="198.24" cy="150.04" r="2.5" fill="#1F5DB4"/>
  <ellipse class="ping" cx="120" cy="213" rx="20" ry="5.5" fill="none" stroke="#1F5DB4" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <ellipse class="ping ping2" cx="120" cy="213" rx="20" ry="5.5" fill="none" stroke="#1F5DB4" stroke-width="2" vector-effect="non-scaling-stroke"/>
  <ellipse class="ground" cx="120" cy="213" rx="20" ry="5.5" fill="none" stroke="#1F5DB4" stroke-width="2.5"/>
  <path class="drop" d="M113 30H127V52H159V66H127V158L120 212L113 158V66H81V52H113Z" fill="#E8462F"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
