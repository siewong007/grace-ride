<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grace Ride – loading screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;500;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#FFFFFF}
  body{font-family:Jost,'Century Gothic',Futura,'Segoe UI',sans-serif;color:#474A4F}
  .screen{min-height:100%;box-sizing:border-box;padding:56px 32px 48px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
  .middle{display:flex;flex-direction:column;align-items:center;gap:16px}
  .replay{background:none;border:0;padding:0;margin:0;cursor:pointer;border-radius:16px}
  .replay svg{display:block;overflow:visible}
  .word{font-size:48px;line-height:1;padding:4px 2px;letter-spacing:-0.5px;white-space:nowrap}
  .word .g{color:#E8462F;font-weight:700}
  .word .r{color:#1F5DB4;font-weight:300;margin-left:6px}
  .tag{font-size:12px;font-weight:500;letter-spacing:3px;color:#5F636A}
  .church{display:flex;flex-direction:column;align-items:center;gap:6px}
  .zh{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;font-size:15px;letter-spacing:3px}
  .zh .b{color:#1F5DB4;font-weight:500}
  .zh .k{color:#474A4F;font-weight:700}
  .pj{font-size:11px;font-weight:500;letter-spacing:3px;color:#5F636A}

  .drop{animation:drop 1s .15s cubic-bezier(.25,.1,.15,1) both}
  .ground{transform-box:view-box;transform-origin:120px 213px;animation:ground .5s 1.1s cubic-bezier(.2,.8,.2,1) both}
  .ping{transform-box:view-box;transform-origin:120px 213px;animation:ping 2.4s 1.12s infinite both}
  .ping2{animation-delay:1.42s}
  .arc-l{stroke-dasharray:94 94;animation:arc .37s 1.2s linear both}
  .arc-r{stroke-dasharray:94 94;animation:arc .37s 1.68s linear both}
  .dot-l{transform-box:view-box;transform-origin:41.76px 150.04px;animation:pop .2s 1.2s ease-out both}
  .dot-r{transform-box:view-box;transform-origin:198.24px 150.04px;animation:pop .2s 2s ease-out both}
  .word{animation:wipe .8s 1.95s cubic-bezier(.6,0,.2,1) both}
  .tag{animation:fade .7s 2.45s ease-out both}
  .church{animation:fade .7s 2.65s ease-out both}
  @keyframes drop{0%{transform:translateY(-250px);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes ground{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
  @keyframes ping{0%{transform:scale(.5);opacity:0}6%{opacity:.7}55%,100%{transform:scale(2.8);opacity:0}}
  @keyframes arc{from{stroke-dashoffset:94}to{stroke-dashoffset:0}}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0);transform:translateX(-8px)}to{clip-path:inset(0 0 0 0);transform:none}}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .drop,.ground,.ping,.arc-l,.arc-r,.dot-l,.dot-r,.word,.tag,.church{animation:none}
    .arc-l,.arc-r{stroke-dasharray:none}
    .ping{opacity:0}
  }
</style>
</head>
<body>
<main class="screen">
  <div style="height:20px"></div>
  <div class="middle">
    <button class="replay" type="button" aria-label="Replay the loading animation" onclick="location.reload()">
      <svg viewBox="0 4 240 240" width="212" height="212" aria-hidden="true">
        <path class="arc-l" d="M41.76 150.04 A81 81 0 0 1 107 91.05" fill="none" stroke="#1F5DB4" stroke-width="5"/>
        <path class="arc-r" d="M133 91.05 A81 81 0 0 1 198.24 150.04" fill="none" stroke="#1F5DB4" stroke-width="5"/>
        <circle class="dot-l" cx="41.76" cy="150.04" r="2.5" fill="#1F5DB4"/>
        <circle class="dot-r" cx="198.24" cy="150.04" r="2.5" fill="#1F5DB4"/>
        <ellipse class="ping" cx="120" cy="213" rx="20" ry="5.5" fill="none" stroke="#1F5DB4" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <ellipse class="ping ping2" cx="120" cy="213" rx="20" ry="5.5" fill="none" stroke="#1F5DB4" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <ellipse class="ground" cx="120" cy="213" rx="20" ry="5.5" fill="none" stroke="#1F5DB4" stroke-width="2.5"/>
        <path class="drop" d="M113 30H127V52H159V66H127V158L120 212L113 158V66H81V52H113Z" fill="#E8462F"/>
      </svg>
    </button>
    <div class="word"><span class="g">Grace</span><span class="r">Ride</span></div>
    <div class="tag">FREE RIDES · CHURCH EVENTS</div>
  </div>
  <div class="church">
    <div class="zh"><span class="b">卫理公会八达灵</span><span class="k">新市堂</span></div>
    <div class="pj">PJ STATE</div>
  </div>
</main>
</body>
</html>
