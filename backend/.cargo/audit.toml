# cargo-audit configuration
[advisories]
# RUSTSEC-2023-0071 (rsa Marvin attack): `rsa` is pulled into Cargo.lock only by
# sqlx-mysql, which this project never compiles (postgres feature only).
# `cargo tree -i rsa --target all` prints nothing. Re-evaluate if MySQL support is added.
# RUSTSEC-2026-0459 (`libsqlite3-sys`): pulled in via `sqlx-macros-core -> sqlx-sqlite`
# in Cargo.lock only; never linked into the PostgreSQL-only runtime binary.
# Sentry 0.34 transitive rustls 0.22 / rustls-webpki 0.102 advisories:
# Used strictly for outbound HTTPS event transport to sentry.io; inbound traffic is
# terminated by Caddy. Sentry Rust SDK does not expose Debug on sessions or parse CRLs.
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0459",
  "RUSTSEC-2026-0346",
  "RUSTSEC-2026-0349",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0382",
]
